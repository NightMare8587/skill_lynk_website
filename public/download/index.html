  // id real and clickable, iOS falls back rather than 404ing).

  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);
  const note = document.getElementById('dl-note');
  if (isIOS) {
    document.getElementById('dl-heading').textContent = "Use SkillLynk in your browser";

    note.textContent = "On Android, the app gives you notifications and a smoother interview call. You can also keep going in your browser.";

    note.textContent = 'On a computer, the browser version has everything. Open this page on your Android phone to get the app.';
