name: Deploy PR Preview to Firebase Hosting

# Every PR against main gets a live, temporary preview URL -- lets a change
# to the static site (or the /app/ build, now the real SkillLynk-Mobile web
# app -- see deploy-web.yml) get eyeballed before merging, without touching
# the production skilllynk-fa13b channel. Reuses the exact same WIF identity
# as deploy-web.yml (same repo, same role is fine -- preview channels are a
# Hosting-admin operation like the production deploy already is, not a
# wider grant). Builds against SkillLynk-Mobile's main branch, not the PR's
# own branch -- a PR here only ever touches this repo's files anyway.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See deploy-web.yml's comment on the MOBILE_REPO_PAT secret.
      - name: Checkout SkillLynk-Mobile
        uses: actions/checkout@v4
        with:
          repository: NightMare8587/SkillLynk-Mobile
          token: ${{ secrets.MOBILE_REPO_PAT }}
          path: skilllynk-mobile

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: skilllynk-mobile
        run: flutter pub get

      # See deploy-web.yml's comment on this step -- same required secrets,
      # duplicated onto this repo since a workflow can't read a checked-out
      # second repo's secrets.
      - name: Write .env
        working-directory: skilllynk-mobile
        run: |
          cat <<EOF > .env
          GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}
          SOCKET_BASE_URL=${{ secrets.SOCKET_BASE_URL }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          EOF

      - name: Build Flutter app (release, base href /app/)
        working-directory: skilllynk-mobile
        run: flutter build web --release --base-href /app/

      - name: Assemble deploy directory
        run: |
          rm -rf public/app
          cp -r skilllynk-mobile/build/web public/app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: skill-lynk-app
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned for the same reason as deploy-web.yml -- 15.22.2+ breaks
      # ADC/WIF auth entirely, see that workflow's comment for the tracking
      # issues.
      - name: Deploy preview channel
        id: deploy
        run: |
          npx firebase-tools@15.22.1 hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project skill-lynk-app --only skilllynk-fa13b --expires 7d --non-interactive \
            --json > preview-result.json
          cat preview-result.json
          # Defensive parse -- grabs whatever the first site's url field is,
          # rather than assuming an exact key path never verified live.
          url=$(node -e "
            const d = JSON.parse(require('fs').readFileSync('preview-result.json','utf8'));
            const result = d.result || d;
            const first = Object.values(result)[0];
            console.log(typeof first === 'string' ? first : first.url);
          ")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const body = `Preview deployed: ${url}\n\nExpires in 7 days or on the next push to this PR, whichever comes first.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('Preview deployed:'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
